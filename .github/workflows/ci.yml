# Build and test on every push/PR. On a version tag (v*), also submit the
# release binaries to SignPath for signing and attach them to a draft release.
#
# One-time setup for signing (after SignPath Foundation approves the project):
#   repository secret   SIGNPATH_API_TOKEN
#   repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#                        SIGNPATH_SIGNING_POLICY_SLUG (e.g. "release-signing")
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        # Advisory until the first warning-free build; then remove continue-on-error.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --workspace --release

      - name: End-to-end test (server + 10 simulated PCs + teacher API)
        shell: pwsh
        run: ./tools/e2e.ps1 -Bin target/release -PcsPerLab 5 -Seconds 60

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($b in 'ew-server','ew-agent','ew-service','ew-sim') {
            Copy-Item "target/release/$b.exe" dist/
          }
          Copy-Item LICENSE, NOTICE, README.md, PRIVACY.md dist/

      - name: Install WiX Toolset 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.Bal.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build installers
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $common = @('-arch', 'x64', '-bindpath', 'installer',
                      '-d', "BinDir=$((Resolve-Path target/release).Path)", '-d', "RepoDir=$((Get-Location).Path)",
                      '-d', "IconFile=$((Resolve-Path installer/app.ico).Path)", '-d', "Version=$v")
          function Build($src, $out, $exts, $extra) {
            wix build $src @common @($exts | ForEach-Object { '-ext', $_ }) @extra -o $out
            if ($LASTEXITCODE) { throw "wix build $src failed" }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Build installer/Student.wxs dist/ExamWatch-Student.msi @('WixToolset.UI.wixext', 'WixToolset.Util.wixext') @()
          Build installer/StudentSetup.wxs dist/ExamWatch-Student-Setup.exe @('WixToolset.Bal.wixext', 'WixToolset.Util.wixext') `
            @('-d', "StudentMsi=$((Resolve-Path dist/ExamWatch-Student.msi).Path)")
          Build installer/Teacher.wxs dist/ExamWatch-Teacher.msi @('WixToolset.UI.wixext', 'WixToolset.Firewall.wixext', 'WixToolset.Util.wixext') `
            @('-d', "StudentMsi=$((Resolve-Path dist/ExamWatch-Student.msi).Path)", '-d', "StudentExe=$((Resolve-Path dist/ExamWatch-Student-Setup.exe).Path)")
          Build installer/TeacherSetup.wxs dist/ExamWatch-Teacher-Setup.exe @('WixToolset.Bal.wixext', 'WixToolset.Util.wixext') `
            @('-d', "TeacherMsi=$((Resolve-Path dist/ExamWatch-Teacher.msi).Path)")
          Remove-Item dist/*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem dist | Format-Table Name, Length

      - name: Installer test (install, first run, student ZIP, uninstall)
        shell: pwsh
        run: ./tools/installer-test.ps1 -Dist dist

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: examwatch-unsigned
          path: dist/
          if-no-files-found: error

  sign:
    # Only tagged releases are signed, and only after SignPath is configured.
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Submit to SignPath (waits for approval)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Draft GitHub release with signed binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: signed/**
