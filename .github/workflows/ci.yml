# Build and test on every push/PR. On a version tag (v*), also submit the
# release binaries to SignPath for signing and attach them to a draft release.
#
# One-time setup for signing (after SignPath Foundation approves the project):
#   repository secret   SIGNPATH_API_TOKEN
#   repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#                        SIGNPATH_SIGNING_POLICY_SLUG (e.g. "release-signing")
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        # Advisory until the first warning-free build; then remove continue-on-error.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --workspace --release

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($b in 'ew-server','ew-agent','ew-service','ew-sim') {
            Copy-Item "target/release/$b.exe" dist/
          }
          Copy-Item LICENSE, NOTICE, README.md, PRIVACY.md dist/

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: examwatch-unsigned
          path: dist/
          if-no-files-found: error

  sign:
    # Only tagged releases are signed, and only after SignPath is configured.
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Submit to SignPath (waits for approval)
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Draft GitHub release with signed binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: signed/**
